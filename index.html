<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tournament Live Score</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: #153e35; color: #fff; gap: 16px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-icon {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .logo-icon img { width: 36px; height: 36px; object-fit: contain; }
    .logo-text {
      font-size: 18px; font-weight: 700;
      color: #fff; text-align: center;
      letter-spacing: 0.5px; line-height: 1.3;
    }
    .logo-sub {
      font-size: 13px; opacity: 0.6;
      text-align: center;
    }
    p { font-size: 16px; opacity: 0.8; }
    #iframeWrapper {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      /* FIX (overflow regression): don't hard-clip horizontally. If sizing
         is ever off by a few px (e.g. a scrollbar-width rounding quirk),
         this lets content scroll into view instead of disappearing behind
         overflow:hidden. This is the "containment strategy that doesn't
         rely on parent-level hiding" fallback — normally invisible since
         correct sizing (below) means it's never actually needed. */
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      /* Hints the compositor that this layer may be resized, so the
         (now rare, real-resize-only) size changes are cheap. */
      will-change: transform;
    }
    #launcherIframe {
      position: absolute; top: 0; left: 0;
      display: block; border: none;
      width: 100%; height: 100%;
      /* No transform anywhere — see script comment for why we don't use
         one, and why that's actually the fix for the "locked" zoom feel. */
    }
  </style>
</head>
<body id="loadingScreen">
  <div id="loadingContent">
    <div class="logo-icon"><img src="LOGO_BASE64_HERE" alt="Tournament Logo"></div>
    <div class="logo-text">Interdepartmental<br>Volleyball Tournament</div>
    <div class="logo-sub">2026</div>
    <div class="spinner"></div>
    <p>Loading Tournament Live Score...</p>
  </div>
  <div id="iframeWrapper" style="display:none;">
    <iframe id="launcherIframe" referrerpolicy="no-referrer" allowfullscreen allow="fullscreen"></iframe>
  </div>
  <script>
    var BASE_URL = 'https://script.google.com/macros/s/AKfycbx2DmKsBSyKtpZNrC3RNTEUBsAUEVmZXTEQxCpwFn4E9aXUr55jnB3iVr0VvM1GVpHy/exec';

    var iframe = document.getElementById('launcherIframe');
    var loading = document.getElementById('loadingContent');
    var wrapper = document.getElementById('iframeWrapper');

    /*
     * FIX (this round — overflow + "locked zoom" regression):
     * The previous version sized the iframe off `window.visualViewport`,
     * which shrinks as the user pinch-zooms IN (it reports the currently
     * *visible* slice of the page, not the page's layout size). That made
     * every zoom tick shrink the iframe's real CSS box, which (a) pushed
     * the app's own min-widths/touch-target floors past the available
     * space, causing horizontal overflow, and (b) fought the browser's
     * native, compositor-only pinch-zoom by forcing a real DOM relayout
     * mid-gesture — which is what produced the "independently zooming /
     * locked" feel.
     *
     * The correct source is `window.innerWidth`/`innerHeight` — the
     * LAYOUT viewport, not the visual one. The layout viewport does not
     * change during pinch-zoom (only real events change it: rotation,
     * address-bar show/hide, actual window resize). Sizing off it means:
     *   - the iframe's box never changes size just because the user
     *     zoomed, so there's nothing to overflow;
     *   - zoom is handled 100% natively by the browser's own compositor,
     *     which already magnifies the launcher shell and the iframe
     *     together, in sync, with full hardware acceleration — because
     *     neither one is being touched by JS during the gesture.
     * In other words: the fix for "make zoom smooth and in sync" is to
     * make this code invisible to zoom entirely, not to add custom
     * transform/easing logic that tries to reproduce what the browser
     * already does for free.
     */
    function getViewportSize() {
      return { w: window.innerWidth, h: window.innerHeight };
    }

    var lastSizedW = 0;
    var lastSizedH = 0;

    function sizeIframe() {
      var size = getViewportSize();
      // No-op if nothing real changed. Because we're reading the layout
      // viewport, this also means: no-op during pinch-zoom, since zoom
      // never changes these values in the first place.
      if (size.w === lastSizedW && size.h === lastSizedH) return;
      lastSizedW = size.w;
      lastSizedH = size.h;
      wrapper.style.width = size.w + 'px';
      wrapper.style.height = size.h + 'px';
      iframe.style.width = size.w + 'px';
      iframe.style.height = size.h + 'px';
    }

    function showIframe() {
      loading.style.display = 'none';
      wrapper.style.display = 'block';
      iframe.src = BASE_URL;
    }

    // Pre-size while loading screen is visible
    sizeIframe();
    // Show iframe after 1.5 seconds
    setTimeout(showIframe, 1500);

    iframe.addEventListener('load', function() {
      if (loading.style.display !== 'none') {
        loading.style.display = 'none';
        wrapper.style.display = 'block';
      }
    });

    var resizeTimer;
    function scheduleResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(sizeIframe, 200);
    }

    // Plain `resize` is fine here (no visualViewport needed) — because
    // sizeIframe() reads the zoom-stable layout viewport, a spurious fire
    // during zoom just re-reads the same numbers and no-ops above.
    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', function () {
      setTimeout(sizeIframe, 400);
    });
  </script>
</body>
</html>

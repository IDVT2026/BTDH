<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Tournament Live Score</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f6f6;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      min-width: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #f5f6f6;
    }
    iframe {
      display: block;
      width: 100%;
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      border: none;
      overflow: hidden;
    }
    .external-fullscreen {
        position: fixed;
        top: 0px;
        right: 0px;
        background: rgb(0 0 0 / 0%);
        backdrop-filter: blur(4px);
        color: white;
        border: none;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        font-size: 10px;
        cursor: pointer;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }
    .external-fullscreen:hover { background: #007bff; transform: scale(1.05); }
    /* Temporary overlay to capture first click on iframe area */
    .click-capture-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 10000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <iframe id="launcherIframe" 
    src=""
    referrerpolicy="no-referrer"
    allowfullscreen
    allow="fullscreen">
  </iframe>
  <button id="externalFullscreenBtn" class="external-fullscreen" title="Full screen">[]</button>
  <!-- Temporary overlay for first click -->
  <div id="firstClickOverlay" class="click-capture-overlay"></div>

  <script>
    const baseUrl = 'https://script.google.com/macros/s/AKfycbykY63tpyQsLK1rjmD-KjMZtbrmMU6qZaY_8k5yqzRIVNZCV5Q-flxs8P-8_zDi6yg6/exec';
    const iframe = document.getElementById('launcherIframe');

    function getViewportWidth() {
      return Math.max(1, Math.round(
        (window.visualViewport && window.visualViewport.width) ||
        document.documentElement.clientWidth ||
        window.innerWidth ||
        screen.width
      ));
    }

    function buildEmbedUrl() {
      const target = new URL(baseUrl);
      const source = new URLSearchParams(window.location.search);
      ['mode', 'view'].forEach((key) => {
        if (source.has(key)) target.searchParams.set(key, source.get(key));
      });
      target.searchParams.set('embedded', '1');
      target.searchParams.set('embedWidth', String(getViewportWidth()));
      return target.toString();
    }

    let lastViewportWidth = 0;
    let resizeTimer = 0;

    function loadFrame() {
      lastViewportWidth = getViewportWidth();
      iframe.src = buildEmbedUrl();
    }

    function refreshFrameForViewport() {
      const nextWidth = getViewportWidth();
      if (Math.abs(nextWidth - lastViewportWidth) < 24) return;
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(loadFrame, 250);
    }

    loadFrame();
    window.addEventListener('resize', refreshFrameForViewport);
    window.addEventListener('orientationchange', refreshFrameForViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', refreshFrameForViewport);
    }

    const btn = document.getElementById('externalFullscreenBtn');
    function enterFullscreen() {
      if (!document.documentElement.requestFullscreen) return;
      document.documentElement.requestFullscreen().catch(console.warn);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        enterFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
    btn.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      btn.textContent = document.fullscreenElement ? 'x' : '[]';
      btn.title = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
    });

    // --- First click anywhere (captured by overlay) ---
    const overlay = document.getElementById('firstClickOverlay');
    overlay.addEventListener('click', function onFirstClick() {
      // Remove overlay immediately
      overlay.removeEventListener('click', onFirstClick);
      overlay.remove();
      // Enter fullscreen when the browser supports it.
      enterFullscreen();
    });
    // Also for touch devices
    overlay.addEventListener('touchstart', function onFirstTouch() {
      overlay.removeEventListener('touchstart', onFirstTouch);
      overlay.remove();
      enterFullscreen();
    });
  </script>
</body>
</html>

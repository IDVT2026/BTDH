<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tournament Live Score</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: #153e35; color: #fff; gap: 16px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-icon {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .logo-icon img { width: 36px; height: 36px; object-fit: contain; }
    .logo-text {
      font-size: 18px; font-weight: 700;
      color: #fff; text-align: center;
      letter-spacing: 0.5px; line-height: 1.3;
    }
    .logo-sub {
      font-size: 13px; opacity: 0.6;
      text-align: center;
    }
    p { font-size: 16px; opacity: 0.8; }
    #iframeWrapper {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }
    #launcherIframe {
      position: absolute; top: 0; left: 0;
      display: block; border: none;
      width: 100%; height: 100%;
      /* FIX: no more `transform: scale()` here — see the comment in the
         script below for why the old transform-based scaling was the
         cause of the mobile zoom -> reload -> crash bug. */
    }
  </style>
</head>
<body id="loadingScreen">
  <div id="loadingContent">
    <div class="logo-icon"><img src="LOGO_BASE64_HERE" alt="Tournament Logo"></div>
    <div class="logo-text">Interdepartmental<br>Volleyball Tournament</div>
    <div class="logo-sub">2026</div>
    <div class="spinner"></div>
    <p>Loading Tournament Live Score...</p>
  </div>
  <div id="iframeWrapper" style="display:none;">
    <iframe id="launcherIframe" referrerpolicy="no-referrer" allowfullscreen allow="fullscreen"></iframe>
  </div>
  <script>
    var BASE_URL = 'https://script.google.com/macros/s/AKfycbx2DmKsBSyKtpZNrC3RNTEUBsAUEVmZXTEQxCpwFn4E9aXUr55jnB3iVr0VvM1GVpHy/exec';

    var iframe = document.getElementById('launcherIframe');
    var loading = document.getElementById('loadingContent');
    var wrapper = document.getElementById('iframeWrapper');

    function getViewportSize() {
      if (window.visualViewport) {
        return { w: window.visualViewport.width, h: window.visualViewport.height };
      }
      return { w: window.innerWidth, h: window.innerHeight };
    }

    var lastSizedW = 0;
    var lastSizedH = 0;

    function sizeIframe() {
      var size = getViewportSize();
      if (size.w === lastSizedW && size.h === lastSizedH) return;
      lastSizedW = size.w;
      lastSizedH = size.h;
      wrapper.style.width = size.w + 'px';
      wrapper.style.height = size.h + 'px';
      iframe.style.width = size.w + 'px';
      iframe.style.height = size.h + 'px';
    }

    function showIframe() {
      loading.style.display = 'none';
      wrapper.style.display = 'block';
      iframe.src = BASE_URL;
    }

    // Pre-size while loading screen is visible
    sizeIframe();
    // Show iframe after 1.5 seconds
    setTimeout(showIframe, 1500);

    iframe.addEventListener('load', function() {
      if (loading.style.display !== 'none') {
        loading.style.display = 'none';
        wrapper.style.display = 'block';
      }
    });

    var resizeTimer;
    function scheduleResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(sizeIframe, 200);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleResize);
    } else {
      // Fallback for older browsers without visualViewport support.
      window.addEventListener('resize', scheduleResize);
    }
    window.addEventListener('orientationchange', function () {
      setTimeout(sizeIframe, 400);
    });
  </script>
</body>
</html>

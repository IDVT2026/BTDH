<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tournament Live Score</title>
  <meta name="description" content="Interdepartmental Volleyball Tournament 2026">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    #frame-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      min-width: 100%;
      border: none;
      display: block;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
      gap: 12px;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 10;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-family: sans-serif; font-size: 13px;">Loading tournament live score...</div>
  </div>

  <div id="frame-wrapper">
    <iframe
      id="app-frame"
      src="https://script.google.com/macros/s/AKfycbx-tCdoyyPYh5Sj1D81VsAqF0Sj2dvD4eGnS_sxHYRdI84_nk2mdg8J_xb5zT_d-iE4/exec"
      allow="accelerometer; autoplay; camera; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; payment"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-downloads"
      onload="document.getElementById('loading-overlay').style.opacity = '0'; setTimeout(() => document.getElementById('loading-overlay').remove(), 350);"
    ></iframe>
  </div>

  <script>
    // Automatically forwards the exact mobile screen width into the Google Script
    (function() {
      try {
        var iframe = document.getElementById('app-frame');
        if (iframe) {
          var base = iframe.src;
          var width = Math.min(window.innerWidth || 390, screen.width || 390);
          var u = new URL(base);
          u.searchParams.set('embedWidth', String(Math.round(width)));
          iframe.src = u.toString();
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>

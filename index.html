<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interdepartmental Volleyball Tournament 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100%; overflow: hidden; overflow-x: hidden; }
    iframe {
      width: 100%; height: 100%; min-width: 0; max-width: 100%;
      display: block; border: none;
      contain: layout style paint;
      transform-origin: top left;
    }
    .external-fullscreen {
      position: fixed;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0);
      backdrop-filter: blur(4px);
      color: rgba(0, 0, 0, 0.58);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .external-fullscreen:hover { background: #007bff; transform: scale(1.05); color: #fff; }
    @media (max-width: 480px) {
      .external-fullscreen { width: 32px; height: 32px; font-size: 14px; top: 4px; right: 4px; }
    }
  </style>
</head>
<body>
  <iframe id="launcherIframe"
    src="https://script.google.com/macros/s/AKfycbyGOoaOwPd7ZSmQM4xt_c2QbyFu73wydTm3uk3pN1ACBMZ4KZ1LYiCyjX6CwkKsR7xm/exec"
    referrerpolicy="no-referrer"
    allowfullscreen
    allow="fullscreen">
  </iframe>
  <button id="externalFullscreenBtn" class="external-fullscreen" title="Full screen">&#x2322;</button>

  <script>
    var baseUrl = 'https://script.google.com/macros/s/AKfycbyGOoaOwPd7ZSmQM4xt_c2QbyFu73wydTm3uk3pN1ACBMZ4KZ1LYiCyjX6CwkKsR7xm/exec';
    var iframe = document.getElementById('launcherIframe');
    iframe.src = baseUrl;

    var btn = document.getElementById('externalFullscreenBtn');
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(e) { console.warn(e); });
      } else {
        document.exitFullscreen();
      }
    }
    btn.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', function() {
      btn.innerHTML = document.fullscreenElement ? '&#x2715;' : '&#x2322;';
      btn.title = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
    });

    window.addEventListener('resize', function() {
      iframe.style.transform = '';
    });
  </script>
</body>
</html>
